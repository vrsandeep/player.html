# Extra types are merged with the stock mime map (same http context).
types {
    audio/aac aac;
    audio/x-matroska mka;
    audio/flac flac;
    audio/ogg opus;
    audio/x-mpegurl m3u;
    video/x-matroska mkv;
    text/vtt vtt;
    application/x-subrip srt;
}

# Sec-Fetch-* is only sent to secure origins; plain-HTTP navigations still send Upgrade-Insecure-Requests.
map "$http_sec_fetch_dest|$http_upgrade_insecure_requests" $is_page_load {
    default        0;
    "~^document\|" 1;
    "|1"           1;
}

server {
    listen 80;
    server_name _;

    # Media volume. Listings are the folder API, so do not prefer an index file.
    root /library;
    index index.disabled;
    charset utf-8;
    server_tokens off;
    # Keep redirects relative so the published host port is preserved.
    absolute_redirect off;
    port_in_redirect off;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types application/json text/css application/javascript text/vtt;

    # Generated at startup by 40-player-auth.sh from AUTH_* environment variables.
    include /etc/nginx/player-auth.conf;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        autoindex on;
        autoindex_exact_size on;
        autoindex_localtime on;
        autoindex_format html;
    }

    # Browsers opening / get the player. Directory fetches keep the listing.
    location = / {
        if ($is_page_load) {
            return 302 /player.html;
        }
        autoindex on;
        autoindex_exact_size on;
        autoindex_localtime on;
        autoindex_format html;
    }

    location = /player.html {
        alias /opt/player/player.html;
        add_header Cache-Control "no-cache";
    }

    location = /player.min.html {
        alias /opt/player/player.min.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        alias /opt/player/player.html;
        add_header Cache-Control "no-cache";
    }

    # Files in the /config volume override the built-in defaults.
    location = /player.html.json {
        root /;
        try_files /config/player.html.json /opt/player/player.html.json =404;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        auth_basic off;
        root /;
        try_files /config/manifest.json /library/manifest.json =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Lets manifest icons such as "icon-512.png" live next to manifest.json.
    location ~ ^/[^/]+\.(?:png|svg|webp|ico)$ {
        auth_basic off;
        root /;
        try_files /config$uri /library$uri =404;
    }
}
