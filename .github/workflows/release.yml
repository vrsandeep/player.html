name: Release

# Either push a tag (git tag 2.39.0 && git push origin 2.39.0) or run this
# workflow from the Actions tab on main and pick a bump; it then creates the tag.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      bump:
        description: Version to bump from the latest release
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Releases must come from a commit on main."; exit 1; }

          # Prints "<version> <tag>" for semver tags, sorted ascending.
          semver_tags() { grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | awk '{ v = $0; sub(/^v/, "", v); print v, $0 }' | sort -V; }

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$REF_NAME
            version=${tag#v}
          else
            src_version=$(sed -n "s/.*<meta name='version' content='\([^']*\)'>.*/\1/p" src/player.html)
            latest=$(git tag --list | semver_tags | tail -n 1)
            base=$(printf '%s\n' "${latest%% *}" "$src_version" | sed '/^$/d' | sort -V | tail -n 1)
            IFS=. read -r major minor patch <<< "$base"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *)     version="$major.$minor.$((patch + 1))" ;;
            esac
            # Follow the existing tag style (upstream uses bare versions).
            case "${latest#* }" in v*) tag="v$version" ;; *) tag=$version ;; esac
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists."; exit 1
            fi
          fi

          previous=$(git tag --merged "$GITHUB_SHA" | grep -vxF "$tag" | semver_tags | tail -n 1 | cut -d' ' -f2)
          echo "Releasing $tag (version $version) from $GITHUB_SHA; previous release: ${previous:-none}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

  # publish is skipped when called from here, but reusable workflows must be
  # granted every permission their jobs request.
  ci:
    name: CI
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  docker:
    name: Publish versioned image
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # latest follows main (see ci.yml), so releases only add version tags.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache, so a release cannot pick up layers written by other refs.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}

  release:
    name: GitHub release
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Build release files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python build.py --version "$VERSION"
          cd dist
          sha256sum player.html player.min.html > checksums.txt

      # GitHub's notes list merged PRs (grouped by .github/release.yml); the
      # commit list also covers changes pushed to main without a PR.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            ${PREVIOUS:+-f previous_tag_name="$PREVIOUS"} \
            --jq .body > notes.md
          range=${PREVIOUS:+$PREVIOUS..}$GITHUB_SHA
          {
            echo
            echo "## Commits"
            echo
            git log --no-merges --max-count=100 --format='- %s (%h)' "$range"
            echo
            echo "## Docker"
            echo
            echo "\`docker pull $REGISTRY/$IMAGE_NAME:${TAG#v}\`"
          } >> notes.md
          cat notes.md

      # Creates the tag at this commit when started from the Actions tab.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" dist/player.html dist/player.min.html dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md
